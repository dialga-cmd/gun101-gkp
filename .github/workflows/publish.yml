name: Publish Python Package

on:
  push:
    tags:
      - 'v*'  # Push tags starting with v

permissions:
  contents: read

jobs:
  test:
    name: Run tests before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v

  build:
    name: Build and publish Python package
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate tag matches package version
        # Interim (pre-release) tags such as v3.2.0a1, v3.2.0rc1 are published to
        # PyPI exactly like stable tags, satisfying the OpenSSF "interim versions"
        # criterion. This step ensures the git tag and pyproject.toml agree so the
        # artifact that ships is reproducible from the tagged commit.
        run: |
          GIT_TAG="${GITHUB_REF#refs/tags/}"
          GIT_TAG="${GIT_TAG#v}"
          PKG_VERSION="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "git tag version: ${GIT_TAG}"
          echo "package version: ${PKG_VERSION}"
          if [ "${GIT_TAG}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag version (${GIT_TAG}) does not match pyproject.toml version (${PKG_VERSION}). Bump pyproject.toml before tagging."
            exit 1
          fi
      - name: Build package
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Generate SBOM (CycloneDX)
        uses: cyclonedx/gh-dotnet-generate-sbom@v1.5.0
        with:
          path: '.'
          format: 'json'
          output: 'sbom.json'
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@v1.12.4
