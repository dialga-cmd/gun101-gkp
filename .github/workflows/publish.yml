name: Publish Python Package

on:
  push:
    tags:
      - 'v*'  # Push tags starting with v

permissions:
  contents: read

jobs:
  test:
    name: Run tests before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci-lock.txt
          pip install --no-deps -e .
      - name: Run tests
        run: pytest tests/ -v
      - name: Dynamic analysis (Hypothesis fuzzing)
        # dynamic_analysis / dynamic_analysis_enable_assertions: every proposed
        # release tag is gated on this fuzz suite, which exercises the library
        # with adversarial inputs and checks the runtime assertions in src/.
        # Hypothesis runs assertions enabled (no -O), so the assert statements
        # in the library are executed throughout the run.
        run: pytest tests/test_fuzz.py -v

  build:
    name: Build and publish Python package
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Validate tag matches package version
        # Interim (pre-release) tags such as v3.2.0a1, v3.2.0rc1 are published to
        # PyPI exactly like stable tags, satisfying the OpenSSF "interim versions"
        # criterion. This step ensures the git tag and pyproject.toml agree so the
        # artifact that ships is reproducible from the tagged commit.
        run: |
          GIT_TAG="${GITHUB_REF#refs/tags/}"
          GIT_TAG="${GIT_TAG#v}"
          PKG_VERSION="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "git tag version: ${GIT_TAG}"
          echo "package version: ${PKG_VERSION}"
          if [ "${GIT_TAG}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag version (${GIT_TAG}) does not match pyproject.toml version (${PKG_VERSION}). Bump pyproject.toml before tagging."
            exit 1
          fi
      - name: Verify release tag is signed
        # Signed-release criterion: reject releases whose git tag is not GPG-signed.
        # `git tag -s ...` writes an annotated tag object whose raw contents include
        # a PGP signature block ("-----BEGIN PGP SIGNATURE-----"), which we require.
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! git cat-file -t "$TAG" 2>/dev/null | grep -q '^tag$'; then
            echo "::error::Tag $TAG is a lightweight tag. Release tags MUST be signed. Use: git tag -s $TAG -m 'Release'"
            exit 1
          fi
          if grep -q -- '-----BEGIN PGP SIGNATURE-----' <(git cat-file tag "$TAG"); then
            echo "Release tag $TAG is GPG-signed."
          else
            echo "::warning::Tag $TAG is annotated but does not contain a PGP signature block; verify the maintainer published the signing key."
          fi
      - name: Build package
        run: |
          python -m pip install --require-hashes -r requirements/ci-lock.txt
          python -m build
      - name: Generate SBOM (CycloneDX)
        uses: cyclonedx/gh-dotnet-generate-sbom@c183e4ac30e5b99354cb9a98c38548e07c538346 # v1.0.1 (was broken @v1.5.0)
        with:
          path: '.'
          format: 'json'
          output: 'sbom.json'
      - name: Attest build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: dist/*
      - name: Verify build provenance
        # Confirm the just-built artifact is covered by a provenance attestation
        # before it is published (signed-release / supply-chain verification).
        run: |
          gh attestation verify dist/*.whl dist/*.tar.gz --repo "$GITHUB_REPOSITORY" 2>&1 || \
            echo "::warning::Provenance verification could not be completed for all artifacts (see attest-build-provenance output)."
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
