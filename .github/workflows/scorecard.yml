name: Scorecard supply-chain security
on:
  branch_protection_rule:
  schedule:
    - cron: '17 11 * * 2'
  push:
    branches: [ "main" ]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run analysis
        # v2.4.4 (Scorecard v5.5.0) pulls the action image from ghcr.io.
        # Older tags reference gcr.io/openssf/..., which GitHub Actions can no
        # longer pull (GCR now enforces billing on that project).
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF results to code-scanning
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: results.sarif
          wait-for-processing: true
