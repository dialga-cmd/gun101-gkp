name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci-lock.txt
          pip install --no-deps -e .
      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=gun101gkp --cov-report=term-missing --cov-branch --cov-report=xml --cov-fail-under=90
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  dynamic-analysis:
    name: Dynamic analysis (Hypothesis fuzzing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci-lock.txt
          pip install --no-deps -e .
      - name: Verify runtime assertions are enabled
        # Dynamic analysis must check the assert statements in src/. Python
        # disables asserts under -O; the CI jobs never pass -O (see test_fuzz.py).
        run: |
          python -m pytest tests/test_fuzz.py::test_asserts_enabled_during_dynamic_analysis -q
      - name: Run fuzz suite
        run: |
          python -m pytest tests/test_fuzz.py -q

  reproducible-build:
    name: Reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --require-hashes -r requirements/ci-lock.txt
      - name: Build twice from a fixed SOURCE_DATE_EPOCH
        run: |
          mkdir -p dist1 dist2
          SOURCE_DATE_EPOCH=0 PIP_CONSTRAINT=constraints-build.txt python -m build --outdir dist1
          SOURCE_DATE_EPOCH=0 PIP_CONSTRAINT=constraints-build.txt python -m build --outdir dist2
          python scripts/repro_check.py dist1 dist2

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --require-hashes -r requirements/ci-lock.txt
      - name: Run ruff check
        run: ruff check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package and mypy
        run: |
          python -m pip install --require-hashes -r requirements/ci-lock.txt
          pip install --no-deps -e .
      - name: Run mypy
        run: mypy src

  security:
    name: Dependency / secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks-action scans the commit range between the previous and the
          # current head, e.g. "<prev>^..<head>". With the default shallow
          # checkout (fetch-depth: 1) only the head commit exists locally, so git
          # could not resolve that range and the step died with
          # "ambiguous argument ... unknown revision" / "failed to scan Git
          # repository". Full history also gives gitleaks the whole commit log to
          # scan, which is what this job intends.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --require-hashes -r requirements/ci-lock.txt
          pip install --no-deps -e .
      - name: Run pip-audit
        run: pip-audit
      - name: Run security linter (bandit)
        run: bandit -r src -x tests
      - name: Gitleaks secrets scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        # NOTE: a "full-scan" input was previously set here, but this action
        # version declares no inputs at all -- CI warned
        # "Unexpected input(s) 'full-scan', valid inputs are ['']" and silently
        # ignored it, so the scan was never actually a full one. Full history
        # comes from `fetch-depth: 0` on the checkout step above.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build and check package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --require-hashes -r requirements/ci-lock.txt
      - name: Build sdist and wheel
        run: python -m build
      - name: Look for uncommitted build artifacts (SBOM check happens in publish)
        run: ls -la dist/
