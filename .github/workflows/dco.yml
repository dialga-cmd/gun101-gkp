name: DCO

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: DCO sign-off check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # On pull_request events actions/checkout defaults to the synthetic merge
          # commit (refs/pull/<n>/merge). That commit is generated by GitHub, is not
          # authored by the contributor, and never carries a Signed-off-by trailer,
          # so including it made this check fail on EVERY pull request regardless of
          # whether the contributor signed off correctly. Check out the PR head
          # commit instead. Falls back to the default ref on push events, where
          # github.event.pull_request is empty.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify commits have a Signed-off-by trailer
        shell: bash
        run: |
          # Determine the commits to check.
          # For pull requests, check the commits in the PR; otherwise the latest commits.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.event.pull_request.base.ref }}..HEAD"
          else
            RANGE="HEAD~21..HEAD"
          fi

          FAILED=0
          CHECKED=0
          # --no-merges skips merge commits. Besides the synthetic PR merge commit
          # excluded by the checkout ref above, a contributor may legitimately merge
          # a branch into their own PR; those merges are not separately signable and
          # must not fail the check.
          for hash in $(git rev-list --no-merges "$RANGE" 2>/dev/null); do
            CHECKED=$((CHECKED+1))
            # Report trailers; look for a Signed-off-by trailer line.
            TRAILERS=$(git log -1 --format='%(trailers:unfold)' "$hash")
            if ! printf '%s\n' "$TRAILERS" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $hash is missing a Signed-off-by trailer."
              echo "  Fix with:  git commit --amend -s   (or)  git rebase --signoff"
              FAILED=1
            else
              echo "OK   $hash"
            fi
          done

          if [ "$CHECKED" -eq 0 ]; then
            echo "No commits to check."
            exit 0
          fi
          exit $FAILED
