[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gun101-gkp"
version = "3.0.0"
description = "Ghost Key Protocol for passwordless asymmetric encryption using RSA-4096 and AES-256-GCM"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Aditya Raj"}
]
dependencies = [
    "cryptography>=42.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0"
]

[project.scripts]
gun101gkp = "gun101gkp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]