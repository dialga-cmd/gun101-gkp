[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gun101-gkp"
version = "3.1.2"
description = "Ghost Key Protocol for passwordless asymmetric encryption using RSA-4096 and AES-256-GCM"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Aditya Raj"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
keywords = ["encryption", "rsa", "aes", "cryptography", "asymmetric", "gkp"]
dependencies = [
    "cryptography>=42.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "build>=1.0.0"
]

[project.urls]
Homepage = "https://dialga-cmd.github.io/gun101-gkp/"
Repository = "https://github.com/dialga-cmd/gun101-gkp"
Documentation = "https://github.com/dialga-cmd/gun101-gkp#readme"
Website = "https://dialga-cmd.github.io/gun101-gkp/"
Issues = "https://github.com/dialga-cmd/gun101-gkp/issues"

[project.scripts]
gun101gkp = "gun101gkp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".git", ".venv", "build", "dist", "__pycache__"]
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SIM108"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"