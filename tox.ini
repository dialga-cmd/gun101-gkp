[tox]
envlist = py310, py311, py312, lint, typecheck, repro
skipsdist = true
isolated_build = true

[testenv]
description = Run the unit, security-property, and fuzz (dynamic analysis) suites
deps =
    pytest
    pytest-cov
    hypothesis
    -e .[dev]
commands =
    pytest tests/ -v --cov=gun101gkp --cov-branch --cov-report=term-missing --cov-fail-under=90

[testenv:lint]
description = Lint the source and tests
deps = ruff
commands = ruff check .

[testenv:typecheck]
description = Static type-checking
deps = mypy
commands = mypy src

[testenv:repro]
description = Verify the build is reproducible (identical artifacts across two isolated builds)
# SOURCE_DATE_EPOCH pins build timestamps so successive builds are deterministic.
setenv =
    SOURCE_DATE_EPOCH = 0
    PIP_CONSTRAINT = {toxinidir}/constraints-build.txt
deps = build
commands =
    rm -rf {envtmpdir}/dist1 {envtmpdir}/dist2
    python -m build --outdir {envtmpdir}/dist1
    python -m build --outdir {envtmpdir}/dist2
    python {toxinidir}/scripts/repro_check.py {envtmpdir}/dist1 {envtmpdir}/dist2
